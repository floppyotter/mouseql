name: Collect Magic Kingdom wait times

on:
  workflow_dispatch:

  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect wait times
        run: python scripts/collect_waits.py

      - name: Save new data
        run: |
          git config user.name "mouseql-bot"
          git config user.email "mouseql-bot@users.noreply.github.com"
          git add data/magic_kingdom_waits.csv
          git diff --cached --quiet || git commit -m "Update Magic Kingdom wait data"
          git push