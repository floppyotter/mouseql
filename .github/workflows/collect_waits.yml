name: Run MOUSEQL analysis

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - "Collect Magic Kingdom wait times"
    types:
      - completed

env:
  TZ: America/New_York

permissions:
  contents: write

jobs:
  analyze:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Run data check
        run: sqlite3 -header -column data/mouseql.db < queries/01_data_check.sql

      - name: Run wait time summary
        run: sqlite3 -header -column data/mouseql.db < queries/02_wait_time_summary.sql

      - name: Run hourly analysis
        run: sqlite3 -header -column data/mouseql.db < queries/03_waits_by_hour.sql

      - name: Run best time analysis
        run: sqlite3 -header -column data/mouseql.db < queries/04_best_time_by_attraction.sql

      - name: Run attraction comparison
        run: sqlite3 -header -column data/mouseql.db < queries/05_attraction_comparison.sql

      - name: Run wait time drops
        run: sqlite3 -header -column data/mouseql.db < queries/06_wait_time_drops.sql

      - name: Run volatility analysis
        run: sqlite3 -header -column data/mouseql.db < queries/07_wait_time_volatility.sql

      - name: Run day of week analysis
        run: sqlite3 -header -column data/mouseql.db < queries/08_waits_by_day.sql

      - name: Run day and hour analysis
        run: sqlite3 -header -column data/mouseql.db < queries/09_waits_by_day_and_hour.sql

      - name: Run best attraction time by day
        run: sqlite3 -header -column data/mouseql.db < queries/10_best_time_by_attraction_and_day.sql

      - name: Run current vs typical analysis
        run: sqlite3 -header -column data/mouseql.db < queries/11_current_vs_typical.sql

      - name: Generate Magic Kingdom report
        run: python scripts/generate_report.py

      - name: Save generated report
        run: |
          git config user.name "mouseql-bot"
          git config user.email "mouseql-bot@users.noreply.github.com"
          git add reports/magic_kingdom_report.md
          git diff --cached --quiet || git commit -m "Update Magic Kingdom analysis report"
          git push
